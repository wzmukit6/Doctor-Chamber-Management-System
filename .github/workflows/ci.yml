name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chamber
          POSTGRES_PASSWORD: chamber
          POSTGRES_DB: chamber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chamber -d chamber_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build:shared
      - run: npx prisma generate
        working-directory: apps/api
      - name: Schema matches migrations (no drift)
        working-directory: apps/api
        env:
          SHADOW: postgresql://chamber:chamber@localhost:5432/chamber_shadow
        run: |
          PGPASSWORD=chamber psql -h localhost -U chamber -d chamber_test -c "CREATE DATABASE chamber_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW" --exit-code
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f apps/api/Dockerfile --target runtime -t chamber-api:ci .
      - name: Build backup image
        run: docker build -f apps/api/Dockerfile --target backup -t chamber-backup:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t chamber-web:ci .
      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_ADDRESS=example.com caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate compose file
        working-directory: deploy
        run: |
          mkdir -p secrets && for s in postgres_password app_db_password bootstrap_admin_password metrics_token backup_passphrase; do echo x > secrets/$s; done
          cp env/production.env.example env/production.env
          docker compose -f docker-compose.prod.yml --env-file env/production.env config --quiet
